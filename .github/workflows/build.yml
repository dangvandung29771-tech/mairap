name: Build Frontier Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean stale CI output
        run: rm -rf ci-out

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.2

      - name: Build mod jar
        run: |
          set +e
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV
          set -e

      - name: Upload mod jar
        if: env.BUILD_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: frontier-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish jar to repo
        if: env.BUILD_EXIT == '0'
        run: |
          mkdir -p release
          cp build/libs/*.jar release/
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f release
          git commit -m "ci: publish built mod jar"
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish build log on failure
        if: env.BUILD_EXIT != '0'
        run: |
          mkdir -p ci-out
          tail -c 300000 build.log > ci-out/build.log
          if [ -d build/reports ]; then cp -r build/reports ci-out/reports; fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-out
          git commit -m "ci: publish failing build log"
          git push origin HEAD:${{ github.ref_name }}

      - name: Enforce build success
        run: |
          if [ "${BUILD_EXIT}" != "0" ]; then echo "Build failed - see ci-out/build.log"; exit 1; fi
