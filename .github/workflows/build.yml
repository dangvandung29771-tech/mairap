name: Build Frontier Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean stale CI output
        run: rm -rf ci-out release

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.2

      - name: Build mod jar
        run: |
          set +e
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV
          set -e

      - name: Upload mod jar artifact
        if: env.BUILD_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: frontier-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish built jar into repo
        if: env.BUILD_EXIT == '0'
        run: |
          mkdir -p release
          cp build/libs/frontier-1.0.0.jar release/
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f release
          git commit -m "ci: publish built frontier-1.0.0.jar" || echo "jar unchanged, nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish GitHub release asset
        if: env.BUILD_EXIT == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v1.0.0"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "FRONTIER 1.0.0 — Vanilla+ Expansion" \
              --notes-file RELEASE_NOTES.md || true
          fi
          # Replace the jar asset so the release always carries the latest build.
          gh release delete-asset "$TAG" frontier-1.0.0.jar --yes 2>/dev/null || true
          gh release upload "$TAG" release/frontier-1.0.0.jar --clobber

      - name: Publish build log on failure
        if: env.BUILD_EXIT != '0'
        run: |
          mkdir -p ci-out
          tail -c 300000 build.log > ci-out/build.log
          if [ -d build/reports ]; then cp -r build/reports ci-out/reports; fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-out
          git commit -m "ci: publish failing build log"
          git push origin HEAD:${{ github.ref_name }}

      - name: Enforce build success
        run: |
          if [ "${BUILD_EXIT}" != "0" ]; then echo "Build failed - see ci-out/build.log"; exit 1; fi
